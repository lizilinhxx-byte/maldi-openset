[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maldi-openset"
version = "0.2.0"
description = "Within-strain replicate leakage and unseen-label abstention benchmarking for RKI MALDI-ToF v4.2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Xiaoxiao He"}, {name = "Zilin Li"}]
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.6",
  "scikit-learn-intelex>=2026.1",
  "scipy>=1.13",
  "seaborn>=0.13",
  "xgboost>=2.1",
]

[project.optional-dependencies]
cnn = ["torch>=2.9"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
maldi-openset = "maldi_openset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
